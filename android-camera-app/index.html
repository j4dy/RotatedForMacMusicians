<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Camera | Pixel Experience</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <!-- Material Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
</head>
<body>
    <div id="app">
        <!-- Camera Viewport -->
        <div class="viewport" id="viewport">
            <video id="preview" autoplay playsinline muted></video>
            <canvas id="capture-canvas" style="display: none;"></canvas>
            
            <!-- Zoom Slider -->
            <div class="zoom-container">
                <input type="range" id="zoom-slider" min="1" max="3" step="0.1" value="1">
                <span class="zoom-label">1.0x</span>
            </div>

            <!-- Focus Indicator -->
            <div id="focus-ring" class="focus-ring"></div>
            
            <!-- Shutter Flash Overlay -->
            <div id="flash-overlay"></div>
        </div>

        <!-- Top Controls -->
        <div class="top-bar">
            <button class="icon-btn" id="flash-toggle"><span class="material-icons-round">flash_off</span></button>
            <div class="mode-indicator">Photo</div>
            <button class="icon-btn" id="settings-btn"><span class="material-icons-round">settings</span></button>
        </div>

        <!-- Bottom Controls -->
        <div class="bottom-section">
            <!-- Filter Bar -->
            <div class="filter-bar" id="filter-bar">
                <div class="filter-item active" data-filter="none">Original</div>
                <div class="filter-item" data-filter="grayscale(100%)">B&W</div>
                <div class="filter-item" data-filter="sepia(80%)">Retro</div>
                <div class="filter-item" data-filter="contrast(150%) brightness(110%)">Vivid</div>
                <div class="filter-item" data-filter="invert(100%)">X-Ray</div>
            </div>

            <!-- Mode Selector (Simplified) -->
            <div class="mode-selector">
                <span>PORTRAIT</span>
                <span class="active">PHOTO</span>
                <span>VIDEO</span>
            </div>

            <!-- Main Actions -->
            <div class="main-controls">
                <div class="gallery-preview" id="gallery-preview">
                    <img id="last-photo" src="" alt="" style="display: none;">
                    <div class="empty-gallery"></div>
                </div>

                <button id="shutter" class="shutter-btn">
                    <div class="shutter-inner"></div>
                </button>

                <button class="icon-btn switch-btn" id="switch-camera">
                    <span class="material-icons-round">flip_camera_ios</span>
                </button>
            </div>
        </div>

        <!-- Filter Overlay (Optional) -->
        <div class="filter-controls" id="filter-controls">
            <!-- Dynamically populated or static filters -->
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
